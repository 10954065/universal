# Local development database only. Production uses a managed PostgreSQL service.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: utm
      POSTGRES_PASSWORD: utm_local_dev_only
      POSTGRES_DB: utm
    ports:
      - "5447:5432"
    volumes:
      - utm-db:/var/lib/postgresql/data
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utm"]
      interval: 5s
      retries: 10
volumes:
  utm-db:
